[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neocell"
version = "0.1.0"
description = "A Cell-style PPE/SPE compute model: explicit data movement, replaceable workers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
telemetry = [
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
]
# OTLP export needs the gRPC exporter, which pulls grpcio; optional so the
# core install stays small (ADR-0007).
telemetry-otlp = [
  "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]

[project.scripts]
neocell = "neocell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I"]